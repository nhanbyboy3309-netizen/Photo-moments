apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: active
  namespace: '926601180918'
  labels:
    cloud.googleapis.com/location: us-west1
    managed-by: google-ai-studio
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: '20'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/base-images: '{"app-container":"us-central1-docker.pkg.dev/serverless-runtimes/google-22/runtimes/nodejs22"}'
        run.googleapis.com/container-dependencies: '{"nginx-container":["app-container"]}'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/sessionAffinity: 'false'
        run.googleapis.com/sources: '{"app-container":"gs://ai-studio-bucket-926601180918-us-west1/services/active/version-18/compiled/build_artifacts.tar.gz"}'
    spec:
      containerConcurrency: 80
      containers:
      - env:
        - name: APPLET_ID
          value: dc3a42b8-208b-41bd-9a46-80a6e97b31f9
        - name: GEMINI_API_KEY
          value: AIzaSyBIaBWwAjgGdrkSDWN0I9leNXUQtjDtSSk
        image: us-west1-docker.pkg.dev/ai-studio-registry-prod/ai-studio/deploy-container@sha256:ad9b1d5c6cc21099fa078e6593ef3c70cf20fb84545d6dffd245211c6dcc79eb
        name: nginx-container
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: '0.5'
            memory: 512Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 240
      - args:
        - -c
        - if [ -f server.js ]; then node server.js; else npm start; fi
        command:
        - /bin/sh
        env:
        - name: PORT
          value: '3000'
        - name: APP_URL
          value: https://active-926601180918.us-west1.run.app
        image: scratch
        name: app-container
        resources:
          limits:
            cpu: '1'
            memory: 3Gi
        startupProbe:
          failureThreshold: 10
          periodSeconds: 1
          tcpSocket:
            port: 3000
          timeoutSeconds: 1
      runtimeClassName: run.googleapis.com/linux-base-image-update
      serviceAccountName: 926601180918-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
      volumes:
      - csi:
          driver: gcsfuse.run.googleapis.com
          readOnly: true
          volumeAttributes:
            bucketName: ai-studio-bucket-926601180918-us-west1
            mountOptions: only-dir=services/active/version-16/compiled
        name: applet
